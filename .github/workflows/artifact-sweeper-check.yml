name: Artifact sweeper checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/artifact-sweeper.yml"
      - ".github/workflows/artifact-sweeper.test.mjs"
      - ".github/workflows/artifact-sweeper-check.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-sweeper.yml"
      - ".github/workflows/artifact-sweeper.test.mjs"
      - ".github/workflows/artifact-sweeper-check.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Expired-only deletion contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: node --test .github/workflows/artifact-sweeper.test.mjs

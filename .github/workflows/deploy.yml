name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'dist/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate committed site artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/docs/getting-started.html
          test -f dist/demo/index.html
          test -f dist/CNAME
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Source maps must not be published' >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
